# Metadata only: nothing installs or builds this repository. Consumers take files by tag through
# tools/vendor.py. The backend is named so a tool that reads this file does not fall back to a
# setuptools that rejects `license-files`.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "project-rules"
version = "0.3.0"
description = "How SisyphusMD projects are run, and the shared tooling that holds them to it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cody Bryant" }]

[project.urls]
Homepage = "https://forgejo.bryantserver.com/SisyphusMD/project-rules"
Source = "https://forgejo.bryantserver.com/SisyphusMD/project-rules"
Issues = "https://forgejo.bryantserver.com/SisyphusMD/project-rules/issues"
Changelog = "https://forgejo.bryantserver.com/SisyphusMD/project-rules/src/branch/main/CHANGELOG.md"

# The standard's own lint settings. Deliberately the UNION of both consumers' rule sets, because a
# vendored file has to pass in whichever repo it lands in — linting here with anything weaker just
# moves the failure downstream.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I",
    "B", "C4", "FLY", "ISC", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "UP",
    "PLC", "PLE", "PLW",
]

# Matches dreame-valetudo's exemption for the same file. The import is deferred on purpose, and the
# suppression lives here rather than in the file because a `# noqa` travels with a VENDORED script
# into a consumer that does not enable the rule — where it is flagged as unused.
[tool.ruff.lint.per-file-ignores]
"shared/packaging/check-glibc-floor.py" = ["PLC0415"]
# The gate scripts and their tests run only in this repo's CI and are never vendored as shared
# files, so they keep plain os/open rather than take on the pathlib rewrite the union set asks for.
".forgejo/scripts/*.py" = ["PTH"]
"tests/test_diff_size.py" = ["PTH"]
