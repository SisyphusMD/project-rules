# The Lint and Secrets jobs every repo's CI calls, so no repo carries a copy (#78). A repo with
# its own Lint and Secrets jobs does not call this file, so no check name is posted twice.
name: Lint and secrets
on:
  workflow_call:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse a fork's code
        # checkout refuses a fork's PR head under pull_request_target, but it reads the event name,
        # which is workflow_call in a called file, so the job applies the same rule itself.
        env:
          BASE_ID: ${{ github.event.repository.id }}
          HEAD_ID: ${{ github.event.pull_request.head.repo.id }}
        run: |
          if [ -n "$HEAD_ID" ] && [ "$HEAD_ID" != "$BASE_ID" ]; then
            echo "Refusing to check out a fork's pull request code in this trusted run." >&2
            exit 1
          fi
      - name: Fetch the gate scripts
        env:
          FORGEJO_URL: ${{ github.server_url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Always main (SisyphusMD/project-rules#78): one copy for every repo, outside the PR's checkout and
          # with no local fallback, so the job fails when it cannot be fetched. With the job token, since a
          # git host may require sign-in to view even a public repo (SisyphusMD/project-rules#151); as a header on this one command
          # it stays out of the URL, the log and .git/config.
          if [ -z "$TOKEN" ]; then
            echo "No job token to read SisyphusMD/project-rules with." >&2
            exit 1
          fi
          # From the environment, not argv, which git's trace output records.
          GATE_AUTH="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 | tr -d '\n')" \
            timeout 120 git --config-env=http.extraHeader=GATE_AUTH clone --quiet --depth 1 \
            --single-branch --branch main "$FORGEJO_URL/SisyphusMD/project-rules.git" /tmp/gate
          git -C /tmp/gate log -1 --format='gate scripts: project-rules %H'
      - name: Read the owner's manifest
        env:
          FORGEJO_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          # Read-only on the owner's .project-rules and nothing else; the manifest is private.
          TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
        run: |
          set -euo pipefail
          # The owner's settings for these jobs (SisyphusMD/project-rules#133), from its main and never
          # the PR's, with no defaults: a missing or invalid manifest fails the job. Later steps get the
          # values via $GITHUB_ENV.
          url="$FORGEJO_URL/$OWNER/.project-rules.git"
          if [ -z "$TOKEN" ]; then
            echo "No PROJECT_RULES_TOKEN: the owner keeps it as an Actions secret and the caller maps it in." >&2
            exit 1
          fi
          auth="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          # git's error names the git host's internal address, and a public repo's log is public.
          if ! timeout 120 git -c http.extraHeader="$auth" clone --quiet --depth 1 --single-branch \
              --branch main "$url" /tmp/manifest 2>/dev/null; then
            echo "Cannot read $OWNER/.project-rules: every owner keeps its settings in its env.json." >&2
            exit 1
          fi
          git -C /tmp/manifest log -1 --format="owner manifest: $OWNER/.project-rules %H"
          python3 -I /tmp/gate/.forgejo/scripts/manifest.py env /tmp/manifest/env.json >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # -I everywhere: the checkout is the PR's, so Python must not import modules from it.
      - name: Install linters
        env:
          # renovate: datasource=pypi depName=ruff
          RUFF: "0.17.5"
          # renovate: datasource=pypi depName=yamllint
          YAMLLINT: "1.37.1"
        run: |
          set -eu
          python3 -I -m venv /tmp/lint
          /tmp/lint/bin/pip install -q --index-url "${PACKAGE_INDEX:?from the owner manifest}" \
            "ruff==$RUFF" "yamllint==$YAMLLINT"
      - name: Python
        run: |
          /tmp/lint/bin/ruff check .
          git ls-files -z '*.py' | xargs -0 -r python3 -I -m py_compile
      - name: YAML
        run: |
          /tmp/lint/bin/yamllint -s -d '{extends: relaxed, rules: {line-length: disable}}' .forgejo
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse a fork's code
        # checkout refuses a fork's PR head under pull_request_target, but it reads the event name,
        # which is workflow_call in a called file, so the job applies the same rule itself.
        env:
          BASE_ID: ${{ github.event.repository.id }}
          HEAD_ID: ${{ github.event.pull_request.head.repo.id }}
        run: |
          if [ -n "$HEAD_ID" ] && [ "$HEAD_ID" != "$BASE_ID" ]; then
            echo "Refusing to check out a fork's pull request code in this trusted run." >&2
            exit 1
          fi
      - name: Fetch the gate scripts
        env:
          FORGEJO_URL: ${{ github.server_url }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Always main (SisyphusMD/project-rules#78): one copy for every repo, outside the PR's checkout and
          # with no local fallback, so the job fails when it cannot be fetched. With the job token, since a
          # git host may require sign-in to view even a public repo (SisyphusMD/project-rules#151); as a header on this one command
          # it stays out of the URL, the log and .git/config.
          if [ -z "$TOKEN" ]; then
            echo "No job token to read SisyphusMD/project-rules with." >&2
            exit 1
          fi
          # From the environment, not argv, which git's trace output records.
          GATE_AUTH="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 | tr -d '\n')" \
            timeout 120 git --config-env=http.extraHeader=GATE_AUTH clone --quiet --depth 1 \
            --single-branch --branch main "$FORGEJO_URL/SisyphusMD/project-rules.git" /tmp/gate
          git -C /tmp/gate log -1 --format='gate scripts: project-rules %H'
      - name: Read the owner's manifest
        env:
          FORGEJO_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          # Read-only on the owner's .project-rules and nothing else; the manifest is private.
          TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
        run: |
          set -euo pipefail
          # The owner's settings for these jobs (SisyphusMD/project-rules#133), from its main and never
          # the PR's, with no defaults: a missing or invalid manifest fails the job. Later steps get the
          # values via $GITHUB_ENV.
          url="$FORGEJO_URL/$OWNER/.project-rules.git"
          if [ -z "$TOKEN" ]; then
            echo "No PROJECT_RULES_TOKEN: the owner keeps it as an Actions secret and the caller maps it in." >&2
            exit 1
          fi
          auth="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          # git's error names the git host's internal address, and a public repo's log is public.
          if ! timeout 120 git -c http.extraHeader="$auth" clone --quiet --depth 1 --single-branch \
              --branch main "$url" /tmp/manifest 2>/dev/null; then
            echo "Cannot read $OWNER/.project-rules: every owner keeps its settings in its env.json." >&2
            exit 1
          fi
          git -C /tmp/manifest log -1 --format="owner manifest: $OWNER/.project-rules %H"
          python3 -I /tmp/gate/.forgejo/scripts/manifest.py env /tmp/manifest/env.json >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the PR head's history
        env:
          # renovate: datasource=github-tags depName=gitleaks/gitleaks
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$tgz" \
            "${RELEASE_MIRROR:?from the owner manifest}/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  /tmp/$tgz" | sha256sum -c -
          tar -xzf "/tmp/$tgz" -C /tmp gitleaks
          # Allowlists come from main only, so a PR cannot allowlist its own secret.
          rm -f .gitleaks.toml .gitleaksignore
          git show "${{ github.event.pull_request.base.sha }}:.gitleaks.toml" > .gitleaks.toml 2>/dev/null || rm -f .gitleaks.toml
          git show "${{ github.event.pull_request.base.sha }}:.gitleaksignore" > .gitleaksignore 2>/dev/null || rm -f .gitleaksignore
          # Only the PR head's history: the clone also holds issue-archive (rule 21), whose nightly
          # copy of issue text is not code and would fail every PR on a hex string quoted in an
          # issue. gitleaks exits 0 when it scans nothing, so re-prove both directions (a head
          # secret fails, an archive-only one passes) on any version bump; proven on 8.28.0.
          /tmp/gitleaks git --no-banner --redact --log-opts="${{ github.event.pull_request.head.sha }}" .
