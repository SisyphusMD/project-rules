# PR checks for issue-first repos; main's protection rule requires every job.
# pull_request_target runs this file from main, not from the PR, so a PR cannot weaken a check
# by editing it. Jobs check out the PR head only as data (lint, scan, diff); none runs its code.
# Canonical copy: bryantserver/project-rules; repos get a copy.
name: CI
on:
  pull_request_target:
    branches: [main]
    # edited: fixing the description re-runs the issue-link check.
    types: [opened, edited, synchronize, reopened]
concurrency:
  # Per PR and event: under pull_request_target github.ref is main for every PR.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base commit's copy of the check, so a PR cannot edit the check to pass itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: PR names its issue
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # read:issue only, for `owner/repo#n`: the job token cannot read other private repos.
          ISSUE_READ_TOKEN: ${{ secrets.ISSUE_READ_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I .forgejo/scripts/issue-link.py
  tests-with-code:
    name: Tests with code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Code changes come with tests
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The full head history usually holds the base; fetch it otherwise, with the token
          # passed per command because the checkout does not keep credentials.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
              fetch --quiet origin "$BASE_SHA"
          fi
          # The base commit's copy only, so a PR cannot loosen or replace the check: with no trusted
          # copy the job fails rather than run the PR's, which would run with the token in reach.
          git show "$BASE_SHA:.forgejo/scripts/tests-with-code.py" > /tmp/tests-with-code.py
          python3 -I /tmp/tests-with-code.py "$BASE_SHA" "$HEAD_SHA"
  diff-size:
    name: Diff size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Diff stays small
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
              fetch --quiet origin "$BASE_SHA"
          fi
          # The base commit's copy only, so a PR cannot loosen or replace the check: with no trusted
          # copy the job fails rather than run the PR's, which would run with the token in reach.
          git show "$BASE_SHA:.forgejo/scripts/diff-size.py" > /tmp/diff-size.py
          python3 -I /tmp/diff-size.py "$BASE_SHA" "$HEAD_SHA"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # -I everywhere: the checkout is the PR's, so Python must not import modules from it.
      - name: Install linters
        run: |
          python3 -I -m venv /tmp/lint
          /tmp/lint/bin/pip install -q --index-url https://artifacts.lan.bryantserver.com/pypi.org/simple/ \
            ruff==0.17.5 yamllint==1.37.1
      - name: Python
        run: |
          /tmp/lint/bin/ruff check .
          git ls-files -z '*.py' | xargs -0 -r python3 -I -m py_compile
      - name: YAML
        run: |
          /tmp/lint/bin/yamllint -s -d '{extends: relaxed, rules: {line-length: disable}}' .forgejo
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$tgz" \
            "https://artifacts.lan.bryantserver.com/github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  /tmp/$tgz" | sha256sum -c -
          tar -xzf "/tmp/$tgz" -C /tmp gitleaks
          # Allowlists come from main only, so a PR cannot allowlist its own secret.
          rm -f .gitleaks.toml .gitleaksignore
          git show "${{ github.event.pull_request.base.sha }}:.gitleaks.toml" > .gitleaks.toml 2>/dev/null || rm -f .gitleaks.toml
          git show "${{ github.event.pull_request.base.sha }}:.gitleaksignore" > .gitleaksignore 2>/dev/null || rm -f .gitleaksignore
          /tmp/gitleaks git --no-banner --redact .
