# The issue-link, tests-with-code and diff-size jobs every repo's CI calls, so no repo carries a copy
# (#78). Each repo's ci.yml calls this from project-rules main under pull_request_target and maps
# only ISSUE_READ_TOKEN in; github.event is the caller's. Checks keep their names:
# `CI / Issue link (pull_request_target)` and so on.
name: Gate checks
on:
  workflow_call:
jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the gate scripts
        env:
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Always main (SisyphusMD/project-rules#78): one copy for every repo, outside the PR's checkout and
          # with no local fallback, so the job fails when it cannot be fetched. The repo is public.
          timeout 120 git clone --quiet --depth 1 --single-branch --branch main \
            "$FORGEJO_URL/SisyphusMD/project-rules.git" /tmp/gate
          git -C /tmp/gate log -1 --format='gate scripts: project-rules %H'
      - name: PR names its issue
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # read:issue only, for `owner/repo#n`: the job token cannot read other private repos.
          ISSUE_READ_TOKEN: ${{ secrets.ISSUE_READ_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I /tmp/gate/.forgejo/scripts/issue-link.py
  tests-with-code:
    name: Tests with code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the gate scripts
        env:
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Always main (SisyphusMD/project-rules#78): one copy for every repo, outside the PR's checkout and
          # with no local fallback, so the job fails when it cannot be fetched. The repo is public.
          timeout 120 git clone --quiet --depth 1 --single-branch --branch main \
            "$FORGEJO_URL/SisyphusMD/project-rules.git" /tmp/gate
          git -C /tmp/gate log -1 --format='gate scripts: project-rules %H'
      - name: Refuse a fork's code
        # checkout refuses a fork's PR head under pull_request_target, but it reads the event name,
        # which is workflow_call in a called file, so the job applies the same rule itself.
        env:
          BASE_ID: ${{ github.event.repository.id }}
          HEAD_ID: ${{ github.event.pull_request.head.repo.id }}
        run: |
          if [ -n "$HEAD_ID" ] && [ "$HEAD_ID" != "$BASE_ID" ]; then
            echo "Refusing to check out a fork's pull request code in this trusted run." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Code changes come with tests
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The full head history usually holds the base; fetch it otherwise, with the token
          # passed per command because the checkout does not keep credentials.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
              fetch --quiet origin "$BASE_SHA"
          fi
          python3 -I /tmp/gate/.forgejo/scripts/tests-with-code.py "$BASE_SHA" "$HEAD_SHA"
  diff-size:
    name: Diff size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the gate scripts
        env:
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Always main (SisyphusMD/project-rules#78): one copy for every repo, outside the PR's checkout and
          # with no local fallback, so the job fails when it cannot be fetched. The repo is public.
          timeout 120 git clone --quiet --depth 1 --single-branch --branch main \
            "$FORGEJO_URL/SisyphusMD/project-rules.git" /tmp/gate
          git -C /tmp/gate log -1 --format='gate scripts: project-rules %H'
      - name: Refuse a fork's code
        # checkout refuses a fork's PR head under pull_request_target, but it reads the event name,
        # which is workflow_call in a called file, so the job applies the same rule itself.
        env:
          BASE_ID: ${{ github.event.repository.id }}
          HEAD_ID: ${{ github.event.pull_request.head.repo.id }}
        run: |
          if [ -n "$HEAD_ID" ] && [ "$HEAD_ID" != "$BASE_ID" ]; then
            echo "Refusing to check out a fork's pull request code in this trusted run." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Diff stays small
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
              fetch --quiet origin "$BASE_SHA"
          fi
          python3 -I /tmp/gate/.forgejo/scripts/diff-size.py "$BASE_SHA" "$HEAD_SHA"
