# The owner manifests every repo's gate reads (#136): each can be read the way the shared jobs read
# it, the owners on this git host agree on its settings, and every repo follows its owner's
# visibility policy. This repo's own workflow, never copied; the list of owners lives only here.
# Its log is public, so no step prints a manifest value or a private repo's name.
name: Owners

on:
  push:
    branches: [main]
  # Runs main's copy of this file and checks out main, never the PR's code, since its secret reads
  # every owner's private manifest. The PR's own reader is proven against fixtures by the tests.
  pull_request_target:
    branches: [main]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

concurrency:
  # Under pull_request_target github.ref is main for every PR.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Every owner on this git host whose repos run the shared workflows.
  OWNERS: SisyphusMD bryantserver cody humblepixels

jobs:
  manifests:
    name: The owner manifests can be read and agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same read step every shared job runs (a test holds them equal), on main's reader.
      - name: Use this checkout's scripts as the gate
        run: ln -s "$GITHUB_WORKSPACE" /tmp/gate
      - name: Read the owner's manifest
        env:
          FORGEJO_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          # Read-only on the owner's .project-rules and nothing else; the manifest is private.
          TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
        run: |
          set -euo pipefail
          # The owner's settings for these jobs (SisyphusMD/project-rules#133), from its main and never
          # the PR's, with no defaults: a missing or invalid manifest fails the job. Later steps get the
          # values via $GITHUB_ENV.
          url="$FORGEJO_URL/$OWNER/.project-rules.git"
          if [ -z "$TOKEN" ]; then
            echo "No PROJECT_RULES_TOKEN: the owner keeps it as an Actions secret and the caller maps it in." >&2
            exit 1
          fi
          auth="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          # git's error names the git host's internal address, and a public repo's log is public.
          if ! timeout 120 git -c http.extraHeader="$auth" clone --quiet --depth 1 --single-branch \
              --branch main "$url" /tmp/manifest 2>/dev/null; then
            echo "Cannot read $OWNER/.project-rules: every owner keeps its settings in its env.json." >&2
            exit 1
          fi
          git -C /tmp/manifest log -1 --format="owner manifest: $OWNER/.project-rules %H"
          python3 -I /tmp/gate/.forgejo/scripts/manifest.py env /tmp/manifest/env.json >> "$GITHUB_ENV"
      - name: The manifest's values reach later steps
        # The shared jobs read them from $GITHUB_ENV in the step after the read.
        run: |
          set -euo pipefail
          # Each value the reader validated must arrive unchanged, not one the runner had already.
          python3 -I /tmp/gate/.forgejo/scripts/manifest.py env /tmp/manifest/env.json > /tmp/expected
          while IFS='=' read -r name value; do
            [ "${!name-}" = "$value" ] || { echo "$name was not handed on by the read step" >&2; exit 1; }
            echo "$name arrived"
          done < /tmp/expected
      - name: The owners on this git host agree
        env:
          FORGEJO_URL: ${{ github.server_url }}
          TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          files=()
          for owner in $OWNERS; do
            if ! timeout 120 git -c http.extraHeader="$auth" clone --quiet --depth 1 --single-branch \
                --branch main "$FORGEJO_URL/$owner/.project-rules.git" "/tmp/owners/$owner" 2>/dev/null; then
              echo "Cannot read $owner/.project-rules" >&2
              exit 1
            fi
            files+=("/tmp/owners/$owner/env.json")
          done
          python3 -I .forgejo/scripts/manifest.py drift "${files[@]}"

  visibility:
    name: Every repo follows its owner's visibility policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare each owner's repos with its policy
        env:
          API: ${{ github.server_url }}/api/v1
          FORGEJO_URL: ${{ github.server_url }}
          TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
        # The repos are listed signed out, which is what the world sees: any repo there under a
        # private owner, or a manifest repo there at all, is a breach. The reader bot is a
        # restricted account that sees only the manifests, so a private repo under a public owner
        # is out of this check's sight. A failed request fails the check rather than pass on less.
        run: |
          set -euo pipefail
          auth="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)"
          failed=0
          for owner in $OWNERS; do
            dir="/tmp/visibility/$owner"
            if ! timeout 120 git -c http.extraHeader="$auth" clone --quiet --depth 1 --single-branch \
                --branch main "$FORGEJO_URL/$owner/.project-rules.git" "$dir/manifest" 2>/dev/null; then
              echo "Cannot read $owner/.project-rules" >&2
              exit 1
            fi
            # Forgejo filters a page after applying the limit, so a short page is not the last;
            # only an empty one is.
            for page in $(seq 1 100); do
              curl -fsS "$API/users/$owner/repos?limit=50&page=$page" > "$dir/repos-$page.json"
              [ "$(python3 -I -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$dir/repos-$page.json")" != 0 ] || break
            done
            echo "== $owner"
            python3 -I .forgejo/scripts/manifest.py visibility "$dir/manifest/env.json" "$dir"/repos-*.json || failed=1
          done
          exit "$failed"
